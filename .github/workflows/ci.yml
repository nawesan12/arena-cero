name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests de la simulación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p arena_sim

  build:
    name: Ejecutable (${{ matrix.name }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, bin: arena-cero }
          - { name: macos-x64, os: macos-15-intel, bin: arena-cero }
          - { name: windows-x64, os: windows-latest, bin: arena-cero.exe }
          - { name: linux-x64, os: ubuntu-latest, bin: arena-cero }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build -p arena_client --release
      - uses: actions/upload-artifact@v4
        with:
          name: arena-cero-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
